# macOS 封裝由 Mac runner 組裝並以 ad-hoc 簽章供測試；正式散佈另行執行（見 README 發佈說明）。
# CI 僅限 master 更新及目標 master 的 PR／merge queue；不提供手動觸發。
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
    branches: [master]

permissions:
  contents: read

jobs:
  desktop:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
          # WebGPUSharp 0.5.7 內附的 Dawn 原生函式庫宣告 minos 26.0；
          # 較低 macOS 需以 build/build-dawn.sh 重建原生庫；矩陣 runner 仍反映內附 ABI 的真實需求。
          - os: macos-26
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FilmBatch.sln

      - name: Build
        run: dotnet build FilmBatch.sln -c Release --no-restore

      # 只有沒有可用 WebGPU 介面卡時才略過 GPU 測試；軟體介面卡也實際執行，裝置／像素錯誤仍會失敗。
      - name: Test (Windows serial)
        if: runner.os == 'Windows'
        run: dotnet test FilmBatch.sln -c Release --no-build -m:1 --logger "console;verbosity=detailed" --logger trx --results-directory dist/test-results/win-x64 -- xUnit.ParallelizeTestCollections=false

      - name: Test
        if: runner.os != 'Windows'
        run: dotnet test FilmBatch.sln -c Release --no-build

      - name: Upload Windows test diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FilmBatch-win-x64-tests
          path: dist/test-results/win-x64

      # Native availability/ABI is required on BOTH runners; a missing bundle is a failure.
      - name: Bundled JXL ABI and sample decode
        run: dotnet test tests/FilmBatch.Raw.Tests/FilmBatch.Raw.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~PortableJxlTests|FullyQualifiedName~JpegXlTests"

      # 發佈 + 冒煙測試（無 GPU 時改用 CPU 算圖，仍會驗證原生函式庫與視窗）
      - name: Publish (${{ matrix.rid }}) + smoke
        run: dotnet run build/Build.cs -- --rid ${{ matrix.rid }} --smoke --zip

      - uses: actions/upload-artifact@v4
        with:
          name: FilmBatch-${{ matrix.rid }}
          path: |
            dist/FilmBatch-${{ matrix.rid }}.zip
            dist/smoke-${{ matrix.rid }}.txt
            dist/smoke-${{ matrix.rid }}.png

  shaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install naga-cli
        run: cargo install --locked --version 30.0.1 naga-cli
      - name: Validate embedded WGSL
        run: dotnet run build/CheckShaders.cs

  # 在分支保護／ruleset 中將 pre-merge 設為必要檢查；任何平台失敗或略過都不放行。
  pre-merge:
    if: ${{ always() }}
    needs: [desktop, shaders]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          SHADERS_RESULT: ${{ needs.shaders.result }}
        run: |
          test "$DESKTOP_RESULT" = success
          test "$SHADERS_RESULT" = success

