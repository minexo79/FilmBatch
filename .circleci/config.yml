# 保留既有 webhook 整合；由實際 pipeline 與 GitHub PR 資料決定是否啟動建置。
# 一般事件可先執行小型 admission job，但不直接啟動 desktop／shaders／pre-merge。
version: 2.1
setup: true

jobs:
  admit-ci:
    docker:
      - image: cimg/python:3.12.15
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check webhook PR target and continue CI
          command: |
            python3 build/test-ci-admission.py
            python3 build/ci-timeout.py 120 python3 build/ci-admission.py

workflows:
  admission:
    jobs:
      - admit-ci
